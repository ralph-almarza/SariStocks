<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — SariStocks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <h1>SariStocks</h1>
        <p>Business Management &amp; Sales Inventory System</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn block" type="submit">Log in</button>
      </form>

      <div class="demo-note">
        <b>Demo accounts</b><br>
        Admin: <code>admin / admin123</code><br>
        Manager: <code>maria / manager123</code><br>
        Cashier: <code>ana / cashier123</code>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
